name: build

# Ручной запуск: собрать пакеты, проверить x86_64-сборку, по желанию — черновик релиза.
on:
  workflow_dispatch:
    inputs:
      lines:
        description: "Ветки sing-box (через пробел)"
        default: "1.12 1.13 1.14"
      format:
        description: "Формат пакетов"
        type: choice
        options: [all, ipk, apk]
        default: all
      only:
        description: "Только эти pkgarch через запятую (пусто = все), например x86_64,mipsel_24kc"
        default: ""
      release:
        description: "Создать черновик релиза"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: gen
        run: |
          python3 scripts/gen-matrix.py --format "${{ inputs.format }}" ${{ inputs.only && format('--only {0}', inputs.only) || '' }} > matrix.json
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "\(.format) \(.pkgarch) \(.image)"' matrix.json >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    name: ${{ matrix.format }} ${{ matrix.pkgarch }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache downloads (sing-box sources, Go modules)
        uses: actions/cache@v6
        with:
          path: dl
          key: dl-${{ hashFiles('versions.env') }}
          restore-keys: dl-
      - name: Build in ${{ matrix.image }}
        run: |
          mkdir -p out dl && chmod 777 out dl
          # as root: sdk-build.sh hands the restored dl/ to buildbot, then builds as buildbot
          docker run --rm --user root -v "$PWD:/src:ro" -v "$PWD/out:/out" -v "$PWD/dl:/builder/dl" \
            "${{ matrix.image }}" sh /src/scripts/sdk-build.sh ${{ inputs.lines }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.format }}-${{ matrix.pkgarch }}
          path: out/
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { format: ipk, rootfs: "openwrt/rootfs:x86-64-24.10.8" }
          - { format: apk, rootfs: "openwrt/rootfs:x86-64-25.12.5" }
          - { format: apk, rootfs: "openwrt/rootfs:x86-64-SNAPSHOT" }
    name: test ${{ matrix.rootfs }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.format }}-x86_64
          path: pkgs
      - name: Install into OpenWrt + podkop config check
        run: |
          for line in ${{ inputs.lines }}; do
            v=$(. ./versions.env; eval echo "\$SB_$(echo $line | tr . _)_VERSION")
            for pkg in podkop-engine podkop-engine-full; do
              ls pkgs/"$pkg"_"$v"-* >/dev/null 2>&1 || continue
              mkdir -p "one/$line-$pkg" && cp pkgs/"$pkg"_"$v"-* "one/$line-$pkg/"
              echo "::group::$line $pkg"
              docker run --rm -e PKG="$pkg" -v "$PWD/one/$line-$pkg:/pkgs:ro" -v "$PWD/lab/podkop-check:/t:ro" -v "$PWD/lab:/lab:ro" \
                "${{ matrix.rootfs }}" sh /lab/pkg-test.sh
              echo "::endgroup::"
            done
          done
      - name: REALITY lab (xray old..latest, two dest variants)
        if: matrix.format == 'ipk'
        run: |
          # the status of the gate, not of tee: a mismatch must stop the release
          set -o pipefail
          lab/fetch-bins.sh pkgs lab/bin
          lab/gate.sh lab/bin 2>&1 | tee lab-results.txt
      - uses: actions/upload-artifact@v7
        if: always() && matrix.format == 'ipk'
        with:
          name: lab-results
          path: lab-results.txt
          if-no-files-found: ignore

  release:
    needs: [build, test]
    if: ${{ inputs.release && !cancelled() && needs.build.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: art
          pattern: "*-*"
      - name: Draft releases (one per sing-box line)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir dist && find art -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} dist/ \;
          scripts/release.sh dist ${{ inputs.lines }}
