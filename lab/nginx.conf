worker_processes 1;
error_log /dev/null;
events { worker_connections 256; }
http {
    access_log off;
    # dest для REALITY: сюда xray проксирует всех, кого не признал своим клиентом
    server {
        listen 127.0.0.1:8443 ssl;
        http2 on;
        server_name reality.test;
        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.3;
        location / { return 200 "decoy-site\n"; }
    }
    # «интернет-ресурс», который клиент запрашивает через туннель
    server {
        listen 127.0.0.1:8080;
        location / { return 200 "HELLO-THROUGH-TUNNEL\n"; }
    }
}
