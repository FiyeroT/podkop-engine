
config sing-box 'main'
	option enabled '0'
	option user 'sing-box'
	option conffile '/etc/sing-box/config.json'
	option workdir '/usr/share/sing-box'
	# with podkop: when a DNS server reached directly through the WAN fails,
	# answer from the provider's DNS (0 turns it off)
	option dns_fallback '1'
	# before a urltest group switches to a member, 64 KiB are downloaded through it: a
	# server frozen after ~16 KB passes the usual small test, not this one (0 turns it off)
	option urltest_download_check '1'
	option urltest_download_url 'https://speed.cloudflare.com/__down?bytes=65536'
	# sing-box keeps the Go memory limit at the memory the system can still give;
	# a size here replaces it, off removes it
#	option memory_limit '64MiB'
#	list ifaces 'wan'
#	list ifaces 'wan6'
